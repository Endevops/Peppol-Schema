name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop, 'feature/*', 'hotfix/*']

permissions:
  contents: read

jobs:
  build-test:
    name: Install, lint, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test --coverage

      - name: Fallow report
        id: fallow
        uses: fallow-rs/fallow@v3
        with:
          format: sarif
          score: true
          coverage: coverage/coverage-final.json
          type-aware: true
          save-snapshot: true
          fail-on-issues: true

      - name: Alert on degraded scoping
        if: steps.fallow.outputs.changed-files-unavailable == 'true'
        run: echo "::warning::Fallow ran unscoped; PR scoping disabled by API failure"

      # Not available for orgs
      # - uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: ${{ steps.fallow.outputs.sarif }}

      - name: Build
        run: pnpm build

  release:
    name: Version, tag, and publish
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create git tags and GitHub releases
      issues: write # comment on issues closed by a release
      pull-requests: write # comment on PRs closed by a release
      id-token: write # OIDC trusted publishing / npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for version analysis

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
          scope: '@endevops'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build
        run: pnpm build

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

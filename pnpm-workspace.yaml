overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest@*: 'catalog:'
catalog:
  vitest: 5.1.0
  vite-plus: 1.5.0
  '@vitest/coverage-v8': 5.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
allowBuilds:
  cpu-features: true
  protobufjs: true
  ssh2: true
minimumReleaseAgeExclude:
  - '@endevops/*'
